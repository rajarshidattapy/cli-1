<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PROJECT_NAME}}</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      color: white;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.25rem;
      opacity: 0.9;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      padding: 16px 32px;
      background: white;
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1rem;
      border-radius: 8px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .links {
      margin-top: 2rem;
    }

    .links a {
      color: rgba(255, 255, 255, 0.8);
      margin: 0 1rem;
      text-decoration: none;
    }

    .links a:hover {
      color: white;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>{{PROJECT_NAME}}</h1>
    <p>Your Unlayer email editor is ready!</p>
    <a href="editor.html" class="btn">Open Email Editor</a>
    <div class="links">
      <a href="https://docs.unlayer.com" target="_blank">Documentation</a>
      <a href="https://examples.unlayer.com" target="_blank">Examples</a>
    </div>
  </div>
</body>
</html>
